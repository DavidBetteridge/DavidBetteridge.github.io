        .legend-item {

            margin-bottom: 5px;

        .legend-color {

        .leaflet-container {

        .station-label {

            box-shadow: none;
            font-weight: bold;
            font-size: 10px;
            color: #333;

        ];

        // Filter out non-tube lines as requested
        const excludedLines = ["London Overground", "DLR", "Elizabeth line"];
        const routeData = rawRouteData.filter(d => !excludedLines.includes(d.line));

        const lineColors = {
            "Bakerloo": "#B36305",
            "Central": "#E32017",
            "Circle": "#FFD300",
            "District": "#00782A",
            "Hammersmith & City": "#F3A9BB",
            "Jubilee": "#A0A5A9",
            "Metropolitan": "#9B0056",
            "Northern": "#000000",
            "Piccadilly": "#003688",
            "Victoria": "#0098D4",
            "Waterloo & City": "#95CDBA"
        };

        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([51.5074, -0.1278], 12);

        // No tiles as requested. Using a white background.
        
        const latLons = routeData.filter(d => !d.error).map(d => [d.lat, d.lon]);
        
        let polylineLayer = L.featureGroup().addTo(map);
        let animationMarker = null;

        function drawStaticRoute() {
            polylineLayer.clearLayers();
            if (latLons.length > 0) {
                for (let i = 0; i < routeData.length - 1; i++) {
                    const start = routeData[i];
                    const end = routeData[i+1];
                    if (start.error || end.error) continue;
                    
                    // Skip segments where the line is not in our Tube list
                    if (excludedLines.includes(end.line)) continue;

                    const color = lineColors[end.line] || "#333";
                    L.polyline([[start.lat, start.lon], [end.lat, end.lon]], {
                        color: color, weight: 6, opacity: 1, lineJoin: 'round'
                    }).addTo(polylineLayer)
                    .bindPopup(`${start.name} → ${end.name}<br>Line: ${end.line || 'Unknown'}`);
                    
                    // Add station circles
                    L.circleMarker([start.lat, start.lon], {
                        radius: 3,
                        color: '#333',
                        fillColor: '#fff',
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(polylineLayer);
                }
                
                // End station circle
                const last = routeData[routeData.length - 1];
                L.circleMarker([last.lat, last.lon], {
                    radius: 3,
                    color: '#333',
                    fillColor: '#fff',
                    fillOpacity: 1,
                    weight: 2
                }).addTo(polylineLayer);

                L.circleMarker(latLons[0], { radius: 8, color: 'green', fillOpacity: 1 }).addTo(polylineLayer).bindPopup("Start: " + routeData[0].name);
                L.circleMarker(latLons[latLons.length - 1], { radius: 8, color: 'red', fillOpacity: 1 }).addTo(polylineLayer).bindPopup("End: " + routeData[routeData.length - 1].name);
                
                map.fitBounds(L.latLngBounds(latLons), { padding: [50, 50] });
            }
        }

        async function animateRoute() {
            const playBtn = document.getElementById('playBtn');
            playBtn.disabled = true;
            polylineLayer.clearLayers();
            
            if (animationMarker) map.removeLayer(animationMarker);
            
            animationMarker = L.circleMarker(latLons[0], { 
                radius: 10, color: '#0019a8', fillColor: 'white', fillOpacity: 1, weight: 3 
            }).addTo(map);

            for (let i = 0; i < routeData.length - 1; i++) {
                const start = routeData[i];
                const end = routeData[i+1];
                if (start.error || end.error) continue;
                if (excludedLines.includes(end.line)) continue;

                const color = lineColors[end.line] || "#333";
                L.polyline([[start.lat, start.lon], [end.lat, end.lon]], {
                    color: color, weight: 6, opacity: 1, lineJoin: 'round'
                }).addTo(polylineLayer);
                
                animationMarker.setLatLng([end.lat, end.lon]);
                map.panTo([end.lat, end.lon]);
                
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            playBtn.disabled = false;
            drawStaticRoute();
        }

        document.getElementById('playBtn').addEventListener('click', animateRoute);
        drawStaticRoute();

        // Populate legend
        const legend = document.getElementById('legend');
        const usedLines = [...new Set(routeData.map(d => d.line).filter(l => l && !excludedLines.includes(l)))];
        usedLines.forEach(line => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            const color = lineColors[line] || "#333";
            item.innerHTML = `<div class="legend-color" style="background-color: ${color}"></div><span>${line}</span>`;
            legend.appendChild(item);
        });

    </script>
